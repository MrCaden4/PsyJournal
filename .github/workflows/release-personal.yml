name: Journal+ personal release

# Builds the personal variant, Journal+ (applicationId io.github.fseixaspt.psyjournal.personal), as a signed
# release APK on every push to the personal branch and publishes it as a GitHub Release, so it can be installed
# straight from a phone: Releases → latest → the .apk under Assets.
#
# Signing needs four repository secrets (Settings → Secrets and variables → Actions):
#   PERSONAL_KEYSTORE_BASE64   the .jks keystore, base64-encoded in one line
#   PERSONAL_KEYSTORE_PASSWORD the keystore's password
#   PERSONAL_KEY_ALIAS         the alias of the signing key in the keystore
#   PERSONAL_KEY_PASSWORD      the key's password
# The keystore never touches the repository: it is decoded into the runner's temp folder for the build only.
on:
  push:
    branches: [personal]
  workflow_dispatch:

permissions:
  contents: write

# a newer push supersedes a build that is still running
concurrency:
  group: personal-release
  cancel-in-progress: true

jobs:
  release:
    name: Build signed APK and publish a release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the signing secrets are set
        env:
          KEYSTORE_BASE64: ${{ secrets.PERSONAL_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PERSONAL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PERSONAL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PERSONAL_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing PERSONAL_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing PERSONAL_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing PERSONAL_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing PERSONAL_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them under Settings → Secrets and variables → Actions, then re-run this workflow."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Decode the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PERSONAL_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 --decode > "$RUNNER_TEMP/personal.jks"
          [ -s "$RUNNER_TEMP/personal.jks" ] || { echo "::error::PERSONAL_KEYSTORE_BASE64 did not decode to a keystore"; exit 1; }

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # the signing properties are the ones app/build.gradle.kts reads; Gradle takes them from these variables
      - name: Build the signed release APK
        env:
          ORG_GRADLE_PROJECT_PSYJOURNAL_STORE_FILE: ${{ runner.temp }}/personal.jks
          ORG_GRADLE_PROJECT_PSYJOURNAL_STORE_PASSWORD: ${{ secrets.PERSONAL_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_PSYJOURNAL_KEY_ALIAS: ${{ secrets.PERSONAL_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_PSYJOURNAL_KEY_PASSWORD: ${{ secrets.PERSONAL_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # Journal+ must stay offline: the build fails if any dependency sneaks in a network permission
      - name: Check that the APK asks for no network permission
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          AAPT2=$(ls "$SDK"/build-tools/*/aapt2 | sort -V | tail -n 1)
          "$AAPT2" dump permissions app/build/outputs/apk/release/app-release.apk | tee permissions.txt
          if grep -qE 'android\.permission\.(INTERNET|ACCESS_NETWORK_STATE)' permissions.txt; then
            echo "::error::The APK asks for a network permission, which Journal+ must not have."
            exit 1
          fi

      - name: Name the APK, verify its signature and write the release notes
        id: apk
        run: |
          VERSION=$(sed -n 's/^ *versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          APK="JournalPlus-${VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK" | tee certificate.txt
          sha256sum "$APK" | tee "$APK.sha256"
          {
            echo "Personal build of Journal+ ${VERSION} from \`${GITHUB_SHA::7}\` on the \`${GITHUB_REF_NAME}\` branch."
            echo
            echo "Download **${APK}** below and open it on your phone to install or update Journal+."
            echo
            echo '```'
            cat "$APK.sha256"
            grep 'SHA-256' certificate.txt | head -n 1
            echo '```'
          } > release-notes.md
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=personal-v${VERSION}-build${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.apk.outputs.tag }}" \
            "${{ steps.apk.outputs.apk }}" "${{ steps.apk.outputs.apk }}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Journal+ ${{ steps.apk.outputs.version }} (build ${{ github.run_number }})" \
            --notes-file release-notes.md \
            --latest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
